{% extends 'register/base.html' %}

{% block title %}Create API Token{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-8">
        <h2><i class="bi bi-plus-lg me-2"></i>Create API Token</h2>
    </div>
    <div class="col-md-4 text-end">
        <a href="{% url 'api_token_list' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>Back to Tokens
        </a>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Name *</label>
                <input type="text" name="name" class="form-control" placeholder="e.g., My External System" required>
                <small class="text-muted">A friendly name to identify this token</small>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="2" placeholder="What is this token used for?"></textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Rate Limit (requests/hour)</label>
                <input type="number" name="rate_limit" class="form-control" value="1000" min="100" max="10000">
                <small class="text-muted">Maximum requests per hour for this token</small>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Expires At</label>
                <input type="datetime-local" name="expires_at" class="form-control">
                <small class="text-muted">Leave empty for no expiration</small>
            </div>
            
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i>Create Token
            </button>
        </form>
    </div>
</div>
{% endblock %}
