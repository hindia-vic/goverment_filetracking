{% extends 'register/base.html' %}

{% block title %}Password Reset Complete - File Tracking System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-lg">
            <div class="card-header bg-success bg-opacity-10 text-center py-4">
                <h3 class="mb-1"><i class="bi bi-check2-circle me-2"></i>Password Reset Complete</h3>
            </div>
            <div class="card-body p-4 text-center">
                <div class="alert alert-success">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <p class="mb-0">Your password has been set successfully.</p>
                </div>
                <p class="text-muted">You can now log in with your new password.</p>
                <div class="d-grid mt-4">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Log In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
